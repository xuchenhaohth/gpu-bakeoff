[project]
name = "gpu-bakeoff"
version = "0.1.0"
description = "Vast.ai GPU bake-off orchestrator"
requires-python = ">=3.10"

[tool.ruff]
target-version = "py310"
line-length = 100
src = ["scripts"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.10"
files = ["scripts"]
ignore_missing_imports = true
check_untyped_defs = true

[[tool.mypy.overrides]]
module = ["yaml", "huggingface_hub.*"]
ignore_missing_imports = true
