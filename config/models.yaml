# Hugging Face model registry for the bake-off.
# Accept gated licenses in the browser before prefetch.

models:
  minimax_h3:
    hf_id: MiniMaxAI/MiniMax-H3
    license: open
    gated: true
    runtime: comfyui
    workflow: minimax_h3
    comfyui_nodes:
      - https://github.com/Lightricks/ComfyUI-LTXVideo.git
    disk_gb: 45
    layer_a:
      precision: int8_nvfp4
      notes: pruned INT8 + NVFP4 AWQ (~42.5 GB on disk)

  ideogram_4:
    hf_id: ideogram-ai/ideogram-4-nf4
    license: non_commercial
    gated: true
    runtime: comfyui
    workflow: ideogram_4
    disk_gb: 15
    layer_a:
      precision: nf4
    boss_note: Internal test only — not for production on open weights.

  hunyuan_image_3:
    hf_id: EricRollei/HunyuanImage-3-NF4-v2
    license: open
    gated: false
    runtime: comfyui
    workflow: hunyuan_image_3
    comfyui_nodes:
      - https://github.com/kijai/ComfyUI-HunyuanImage-3.git
    disk_gb: 50
    layer_a:
      precision: nf4
      block_swap: auto
      min_host_ram_gb: 128

  flux2_dev:
    hf_id: black-forest-labs/FLUX.2-dev
    license: open
    gated: true
    runtime: comfyui
    workflow: flux2_dev
    disk_gb: 25
    layer_a:
      precision: fp8

  qwen38_27b:
    hf_id: Qwen/Qwen3.8-27B
    license: apache-2.0
    gated: false
    runtime: vllm
    disk_gb: 55
    layer_a:
      precision: nvfp4
      checkpoint: RadixArk/Qwen3.8-27B-NVFP4
    sku_layers:
      dgx_spark_gb10:
        runtime: llama_cpp
        hf_id: bowmanslayer/Qwen3.8-27B-GGUF
        layer_a:
          precision: q4_k_m
          file_hint: Qwen3.8-27B-Text-Only-Q4_K_M.gguf
        llama_extra_args:
          - --jinja

  deepseek_v4_flash:
    hf_id: prometheusAIR/DeepSeek-V4-Flash-0731-GGUF
    license: mit
    gated: false
    runtime: llama_cpp
    disk_gb: 120
    layer_a:
      precision: iq2_xxs
      file_hint: DeepSeek-V4-Flash-0731-IQ2_XXS
    skip_skus:
      - rtx5090_1x
      - rtx5090_2x
